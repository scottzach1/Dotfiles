# Dracula (dark) — linked to dunstrc.d/50-theme.conf by bspwm/theme-apply.
[global]
    frame_color = "#FF79C6"

[urgency_low]
    background = "#4D4D4D"
    foreground = "#BFBFBF"

[urgency_normal]
    background = "#282A36"
    foreground = "#8BE9FD"

[urgency_critical]
    background = "#FF5555"
    foreground = "#F8F8F2"
