#
# Hyprland config — ported from bspwm/sxhkd.
# Layout: hyprscroller (scrolling columns) — chosen for the 32:9 ultrawide.
# Install the plugin once: hyprpm add https://github.com/dawsers/hyprscroller
#                          hyprpm enable hyprscroller && hyprpm reload

##==========================================##
#   *** NVIDIA (RTX 3080) ***
##==========================================##
# In-config half. Out-of-band half lives in system files (see PR notes / README):
#   /etc/modprobe.d/nvidia.conf  -> options nvidia_drm modeset=1 fbdev=1
#   initramfs MODULES=(... nvidia nvidia_modeset nvidia_uvm nvidia_drm) + mkinitcpio -P
#   prefer the nvidia-open kernel modules (Turing+; the 3080 qualifies)
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
env = ELECTRON_OZONE_PLATFORM_HINT,auto
# Uncomment if you get cursor glitches on nvidia:
# cursor { no_hardware_cursors = true }

##==========================================##
#   *** MONITOR (5120x1440 32:9) ***
##==========================================##
# Monitors live in monitors.conf so the nwg-displays GUI can rewrite them.
# (VRR is nice on the G9 but can flicker on nvidia — enable via misc:vrr below.)
source = ~/.config/hypr/monitors.conf

##==========================================##
#   *** AUTOSTART ***
##==========================================##
# picom / pulseaudio-x11 / wmname / nitrogen / xautolock all retired.
exec-once = waybar                           # was: polybar
exec-once = hyprpaper                         # was: nitrogen
exec-once = mako                              # was: dunst
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = hypridle                          # was: xautolock -> betterlockscreen
exec-once = darkman run                       # day/night Catppuccin Latte<->Mocha switching
exec-once = wl-paste --watch cliphist store   # clipboard history
exec-once = /usr/bin/gnome-keyring-daemon --start --components=pkcs11,secrets,ssh
exec-once = [workspace special:magic silent] kitty --class dropdown
exec-once = xdg-settings set default-web-browser firefox.desktop

##==========================================##
#   *** LOOK & FEEL ***
##==========================================##
# Border palette — swapped between theme-mocha/theme-latte by darkman (day/night).
source = ~/.config/hypr/theme.conf

general {
    layout = master                           # built-in; no plugin (hyprscroller was ABI-broken on 0.55.4)
    border_size = 1
    gaps_in = 5
    gaps_out = 10
    # Catppuccin — mauve->pink gradient active border (values from theme.conf).
    col.active_border = $cat_active1 $cat_active2 45deg
    col.inactive_border = $cat_inactive
}

decoration {
    # Replaces picom entirely.
    rounding = 6
    blur {
        enabled = true
        size = 4
        passes = 2
    }
    shadow {
        enabled = true
        range = 12
    }
}

animations {
    enabled = true
    # set false for a lean, bspwm-like feel
}

master {
    # Your 32:9 fraction layouts, plugin-free:
    #   orientation=center + mfact 0.5  -> 1/4 | 1/2 | 1/4
    #   orientation=center + mfact 0.33 -> 1/3 | 1/3 | 1/3
    #   orientation=left   + mfact      -> 1/3 | 2/3
    orientation = center
    mfact = 0.5
    new_status = slave                        # new windows join the stack, not master
    new_on_top = false
}

input {
    kb_layout = us
    follow_mouse = 1                          # was focus_follows_pointer true
}

misc {
    disable_hyprland_logo = true
    # vrr = 1                                  # try for the G9; back out if nvidia flickers
}

##==========================================##
#   *** APP LAUNCHERS (from sxhkdrc) ***
##==========================================##
$mod = SUPER
bind = $mod, Return, exec, ghostty                    # super+Return (terminal; kitty kept for dropdown)
bind = $mod, space, exec, fuzzel                      # was: rofi -show drun
bind = $mod, period, exec, emote                      # emoji
bind = $mod ALT, space, exec, ~/.config/hypr/window-switcher.sh   # was: rofi -show window
bind = $mod, b, exec, firefox
bind = $mod, p, exec, pycharm-professional
bind = $mod, w, exec, webstorm
bind = $mod, o, exec, obsidian
bind = $mod, t, exec, thunar                          # NOTE: sxhkdrc bound super+t to thunar AND
                                                      # "set tiled"; kept thunar. Float is super+s.
bind = $mod SHIFT, p, exec, 1password                 # was super+shift+1 (collided w/ move-to-ws 1)
bind = $mod SHIFT, s, exec, grim -g "$(slurp)" - | swappy -f -   # was flameshot (repo-only pipeline)
bind = $mod SHIFT, x, exec, hyprlock                  # was betterlockscreen --lock

##==========================================##
#   *** WM CONTROL ***
##==========================================##
bind = $mod, q, killactive,                           # super+q  (bspc node -c)
bind = $mod SHIFT, q, forcekillactive,                # super+shift+q  (bspc node -k)
bind = $mod, Delete, killactive,
bind = $mod ALT, q, exit,                             # super+alt+q  (bspc quit)
bind = $mod ALT, r, exec, hyprctl reload              # super+alt+r  (bspc wm -r)
bind = $mod ALT, s, exec, hyprctl reload              # was: reload sxhkd
bind = $mod ALT, p, exec, killall -SIGUSR2 waybar     # was: relaunch polybar

# state (resolves the super+{t,shift+t,s,f} group; t is thunar)
bind = $mod, s, togglefloating,                       # "floating"
bind = $mod, f, fullscreen, 0                          # true fullscreen
bind = $mod, m, fullscreen, 1                          # maximize-in-place (~monocle)
bind = $mod CTRL, y, pin                               # flag: sticky

##==========================================##
#   *** MASTER LAYOUT: FOCUS / MOVE / SIZE ***
##==========================================##
# All built-in dispatchers — no plugin, nothing to build, cannot break on update.
# your vim-ish map: j=W k=S l=N ;=E  ->  l/d/u/r
bind = $mod, j, movefocus, l
bind = $mod, semicolon, movefocus, r
bind = $mod, l, movefocus, u
bind = $mod, k, movefocus, d
bind = $mod SHIFT, j, movewindow, l
bind = $mod SHIFT, semicolon, movewindow, r
bind = $mod SHIFT, l, movewindow, u
bind = $mod SHIFT, k, movewindow, d
# arrows mirror the above
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

# --- master layout controls (all built-in) ---
# master width = your emphasize/balance pair. binde repeats while held, so you
# can drag the master area to 1/3, 1/2, 2/3 by feel.
binde = $mod, equal, layoutmsg, mfact +0.05
binde = $mod, minus, layoutmsg, mfact -0.05
binde = $mod SHIFT, Insert, layoutmsg, mfact +0.05    # emphasize (grow master)
binde = $mod, Insert, layoutmsg, mfact -0.05          # balance (shrink master)
# toggle orientation: centre (1/4|1/2|1/4, 1/3|1/3|1/3) <-> left (1/3|2/3)
bind = $mod, backslash, layoutmsg, orientationcycle center left
# promote focused window to master, and cycle the stack
bind = $mod, a, layoutmsg, swapwithmaster
bind = $mod, c, layoutmsg, cyclenext
bind = $mod SHIFT, c, layoutmsg, cycleprev
# add/remove a master slot
bind = $mod ALT, equal, layoutmsg, addmaster
bind = $mod ALT, minus, layoutmsg, removemaster

# NO CLEAN EQUIVALENT (bspwm tree verbs): rotate, circulate, swap-biggest,
# marked-node send, preselect-ratio — dropped; hyprscroller has no analogue.

# move a floating window to the other monitor (was super+shift+alt+arrows)
bind = $mod SHIFT ALT, left, movewindow, mon:l
bind = $mod SHIFT ALT, right, movewindow, mon:r

##==========================================##
#   *** WORKSPACES ***
##==========================================##
bind = $mod, bracketleft, workspace, e-1
bind = $mod, bracketright, workspace, e+1
bind = $mod, Prior, workspace, e-1
bind = $mod, Next, workspace, e+1
bind = $mod, Tab, workspace, previous

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# scratchpad (was super+u -> dropdown)
bind = $mod, u, togglespecialworkspace, magic

##==========================================##
#   *** MEDIA KEYS ***
##==========================================##
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+       # was xbacklight
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+  # pipewire
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

##==========================================##
#   *** WINDOW RULES ***
##==========================================##
# DISABLED for now. Hyprland 0.55 deprecated hyprlang in favour of Lua, and the
# hyprlang `windowrule` keyword errors with the v2-style class:/title: matchers
# on this version (`windowrulev2` still works but only with a deprecation-warning
# overlay). These are minor niceties — the dropdown scratchpad is already placed
# by its exec-once `[workspace special:magic silent]`, so it still works without a
# rule. Reinstate these properly when the config migrates to Lua (hl.window_rule).
#   float dropdown terminal
#   float jetbrains win0/splash  (also: enable native Wayland mode per-IDE)
#   float "File Transfer" dialogs

# mouse drag move/resize (bspwm super+drag)
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
