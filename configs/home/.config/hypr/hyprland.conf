#
# Hyprland config — ported from bspwm/sxhkd.
# Layout: hyprscroller (scrolling columns) — chosen for the 32:9 ultrawide.
# Install the plugin once: hyprpm add https://github.com/dawsers/hyprscroller
#                          hyprpm enable hyprscroller && hyprpm reload

##==========================================##
#   *** NVIDIA (RTX 3080) ***
##==========================================##
# In-config half. Out-of-band half lives in system files (see PR notes / README):
#   /etc/modprobe.d/nvidia.conf  -> options nvidia_drm modeset=1 fbdev=1
#   initramfs MODULES=(... nvidia nvidia_modeset nvidia_uvm nvidia_drm) + mkinitcpio -P
#   prefer the nvidia-open kernel modules (Turing+; the 3080 qualifies)
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
env = ELECTRON_OZONE_PLATFORM_HINT,auto
# Uncomment if you get cursor glitches on nvidia:
# cursor { no_hardware_cursors = true }

##==========================================##
#   *** MONITOR (5120x1440 32:9) ***
##==========================================##
# Confirm the name/rate with `hyprctl monitors`. VRR is nice on the G9 but can
# flicker on nvidia — enable cautiously via misc:vrr below.
monitor = , preferred, auto, 1
# monitor = DP-1, 5120x1440@240, 0x0, 1

##==========================================##
#   *** AUTOSTART ***
##==========================================##
# picom / pulseaudio-x11 / wmname / nitrogen / xautolock all retired.
exec-once = hyprpm reload -n                 # load enabled plugins (hyprscroller)
exec-once = waybar                           # was: polybar
exec-once = hyprpaper                         # was: nitrogen
exec-once = mako                              # was: dunst
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = hypridle                          # was: xautolock -> betterlockscreen
exec-once = wl-paste --watch cliphist store   # clipboard history
exec-once = /usr/bin/gnome-keyring-daemon --start --components=pkcs11,secrets,ssh
exec-once = [workspace special:magic silent] kitty --class dropdown
exec-once = xdg-settings set default-web-browser firefox.desktop

##==========================================##
#   *** LOOK & FEEL ***
##==========================================##
general {
    layout = scrolling                        # registered by hyprscroller
    border_size = 1
    gaps_in = 5
    gaps_out = 10
    # Dracula (was normal #44475a / focused #8be9fd). Gradient active border:
    col.active_border = rgb(bd93f9) rgb(ff79c6) 45deg
    col.inactive_border = rgb(44475a)
}

decoration {
    # Replaces picom entirely.
    rounding = 6
    blur {
        enabled = true
        size = 4
        passes = 2
    }
    shadow {
        enabled = true
        range = 12
    }
}

animations {
    enabled = true
    # set false for a lean, bspwm-like feel
}

plugin {
    scroller {
        # cycle order for width (super+equal/minus) — covers all your fractions.
        # onehalf first => a lone window defaults to a centred 2560px 16:9.
        column_widths = onehalf onethird twothirds onefourth one
        window_heights = one onehalf onethird
        focus_wrap = true
    }
}

input {
    kb_layout = us
    follow_mouse = 1                          # was focus_follows_pointer true
}

misc {
    disable_hyprland_logo = true
    # vrr = 1                                  # try for the G9; back out if nvidia flickers
}

##==========================================##
#   *** APP LAUNCHERS (from sxhkdrc) ***
##==========================================##
$mod = SUPER
bind = $mod, Return, exec, terminator                 # super+Return (terminal)
bind = $mod, space, exec, fuzzel                      # was: rofi -show drun
bind = $mod, period, exec, emote                      # emoji
bind = $mod ALT, space, exec, ~/.config/hypr/window-switcher.sh   # was: rofi -show window
bind = $mod, b, exec, firefox
bind = $mod, p, exec, pycharm-professional
bind = $mod, w, exec, webstorm
bind = $mod, o, exec, obsidian
bind = $mod, k, exec, keepassxc
bind = $mod, t, exec, thunar                          # NOTE: sxhkdrc bound super+t to thunar AND
                                                      # "set tiled"; kept thunar. Float is super+s.
bind = $mod SHIFT, p, exec, 1password                 # was super+shift+1 (collided w/ move-to-ws 1)
bind = $mod SHIFT, s, exec, grim -g "$(slurp)" - | swappy -f -   # was flameshot (repo-only pipeline)
bind = $mod SHIFT, x, exec, hyprlock                  # was betterlockscreen --lock

##==========================================##
#   *** WM CONTROL ***
##==========================================##
bind = $mod, q, killactive,                           # super+q  (bspc node -c)
bind = $mod SHIFT, q, forcekillactive,                # super+shift+q  (bspc node -k)
bind = $mod, Delete, killactive,
bind = $mod ALT, q, exit,                             # super+alt+q  (bspc quit)
bind = $mod ALT, r, exec, hyprctl reload              # super+alt+r  (bspc wm -r)
bind = $mod ALT, s, exec, hyprctl reload              # was: reload sxhkd
bind = $mod ALT, p, exec, killall -SIGUSR2 waybar     # was: relaunch polybar

# state (resolves the super+{t,shift+t,s,f} group; t is thunar)
bind = $mod, s, togglefloating,                       # "floating"
bind = $mod, f, fullscreen, 0                          # true fullscreen
bind = $mod, m, fullscreen, 1                          # maximize-in-place (~monocle)
bind = $mod CTRL, y, pin                               # flag: sticky

##==========================================##
#   *** hyprscroller: COLUMNS & ROWS ***
##==========================================##
# focus: left/right = between columns, up/down = rows within a column
# your vim-ish map: j=W k=S l=N ;=E
bind = $mod, j, scroller:movefocus, left
bind = $mod, semicolon, scroller:movefocus, right
bind = $mod, l, scroller:movefocus, up
bind = $mod, k, scroller:movefocus, down
bind = $mod SHIFT, j, scroller:movewindow, left
bind = $mod SHIFT, semicolon, scroller:movewindow, right
bind = $mod SHIFT, l, scroller:movewindow, up
bind = $mod SHIFT, k, scroller:movewindow, down
# arrows mirror the above
bind = $mod, left, scroller:movefocus, left
bind = $mod, right, scroller:movefocus, right
bind = $mod, up, scroller:movefocus, up
bind = $mod, down, scroller:movefocus, down
bind = $mod SHIFT, left, scroller:movewindow, left
bind = $mod SHIFT, right, scroller:movewindow, right
bind = $mod SHIFT, up, scroller:movewindow, up
bind = $mod SHIFT, down, scroller:movewindow, down

# column width = your emphasize/balance pair (1/3 <-> 2/3 etc.)
bind = $mod, equal, scroller:cyclesize, next
bind = $mod, minus, scroller:cyclesize, prev
bind = $mod SHIFT, Insert, scroller:cyclesize, next   # emphasize
bind = $mod, Insert, scroller:cyclesize, prev         # balance (de-emphasize)
bind = $mod ALT, up, scroller:cycleheight, next       # row height
bind = $mod ALT, down, scroller:cycleheight, prev
bind = $mod, c, scroller:alignwindow, center          # centre column (great on 32:9)

# stack windows into a column (replaces the tree ops + tabc tabbing hack)
bind = $mod, a, scroller:admitwindow                  # pull neighbour into this column
bind = $mod, e, scroller:expelwindow                  # push out to its own column
bind = $mod, backslash, scroller:setmode, row         # toggle: new window = row vs column
bind = $mod, grave, scroller:toggleoverview           # bird's-eye of all columns

# NO CLEAN EQUIVALENT (bspwm tree verbs): rotate, circulate, swap-biggest,
# marked-node send, preselect-ratio — dropped; hyprscroller has no analogue.

# move a floating window to the other monitor (was super+shift+alt+arrows)
bind = $mod SHIFT ALT, left, movewindow, mon:l
bind = $mod SHIFT ALT, right, movewindow, mon:r

##==========================================##
#   *** WORKSPACES ***
##==========================================##
bind = $mod, bracketleft, workspace, e-1
bind = $mod, bracketright, workspace, e+1
bind = $mod, Prior, workspace, e-1
bind = $mod, Next, workspace, e+1
bind = $mod, Tab, workspace, previous

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# scratchpad (was super+u -> dropdown)
bind = $mod, u, togglespecialworkspace, magic

##==========================================##
#   *** MEDIA KEYS ***
##==========================================##
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+       # was xbacklight
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+  # pipewire
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

##==========================================##
#   *** WINDOW RULES ***
##==========================================##
windowrulev2 = float, class:^(dropdown)$
windowrulev2 = workspace special:magic, class:^(dropdown)$
# JetBrains splash/startup floats (replaces win0 rule + java non-reparenting hack).
# Remember to enable native Wayland mode in each IDE to avoid XWayland blur.
windowrulev2 = float, class:^(jetbrains-.*)$, title:^(win0|splash)$
windowrulev2 = float, title:^(File Transfer)$

# mouse drag move/resize (bspwm super+drag)
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
