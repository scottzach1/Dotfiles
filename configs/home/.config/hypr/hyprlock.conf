# hyprlock — replaces betterlockscreen. Catppuccin Mocha.
background {
    monitor =
    path = /usr/share/backgrounds/falseWallpaper.png
    blur_passes = 2
    blur_size = 6
}

input-field {
    monitor =
    size = 320, 50
    outline_thickness = 2
    dots_center = true
    outer_color = rgb(cba6f7)
    inner_color = rgb(1e1e2e)
    font_color = rgb(cdd6f4)
    fail_color = rgb(f38ba8)
    check_color = rgb(a6e3a1)
    placeholder_text = <i>Password...</i>
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(cdd6f4)
    font_size = 64
    font_family = FiraCode Nerd Font
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgb(6c7086)
    font_size = 18
    position = 0, 80
    halign = center
    valign = center
}
