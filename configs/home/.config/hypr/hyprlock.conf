# hyprlock — replaces betterlockscreen. Dracula-themed.
background {
    monitor =
    path = /usr/share/backgrounds/falseWallpaper.png
    blur_passes = 2
    blur_size = 6
}

input-field {
    monitor =
    size = 320, 50
    outline_thickness = 2
    dots_center = true
    outer_color = rgb(bd93f9)
    inner_color = rgb(282a36)
    font_color = rgb(f8f8f2)
    fail_color = rgb(ff5555)
    check_color = rgb(8be9fd)
    placeholder_text = <i>Password...</i>
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(f8f8f2)
    font_size = 64
    font_family = FiraCode Nerd Font
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgb(6272a4)
    font_size = 18
    position = 0, 80
    halign = center
    valign = center
}
