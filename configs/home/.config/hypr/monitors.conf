# Monitor layout — sourced by hyprland.conf.
# Edit by hand OR with the `nwg-displays` GUI (it overwrites this file).
# Syntax: monitor = NAME, WIDTHxHEIGHTexpr@Hz, POSITION, SCALE
#
# Samsung Odyssey G9 (LC49G95T) — native 5120x1440. EDID "preferred" mis-picks
# 3840x1080, so pin the native mode explicitly.
monitor = DP-1, 5120x1440@120, 0x0, 1
