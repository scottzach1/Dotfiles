# xdg-desktop-portal backend selection for Hyprland.
# darkman implements org.freedesktop.impl.portal.Settings but only auto-loads on
# sway (UseIn=sway in its .portal file). Assigning it explicitly here makes it the
# authoritative color-scheme backend on Hyprland, so it emits SettingChanged
# reliably on every toggle — which is what Firefox/Chrome/GTK4 listen for.
[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.Settings=darkman
