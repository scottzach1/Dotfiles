# NVIDIA DRM kernel mode setting — required for Wayland/Hyprland on the RTX 3080.
#
# This drop-in is the safe, additive half. The rest is manual on the target box:
#   1. Prefer the open modules: install nvidia-open-dkms (Turing+; the 3080 qualifies).
#   2. Add to initramfs so KMS starts early (avoids boot flicker):
#        /etc/mkinitcpio.conf -> MODULES=(... nvidia nvidia_modeset nvidia_uvm nvidia_drm)
#      then regenerate: sudo mkinitcpio -P
#   3. Explicit sync (the big fix for nvidia flicker/XWayland) comes with recent
#      driver + Hyprland — just keep both current.
options nvidia_drm modeset=1 fbdev=1
